services:
  # This is YOUR container
  rankpilot-ai:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: rankpilot_python_engine
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PYTHONUNBUFFERED=1
    networks:
      - rankpilot_network
    restart: always

networks:
  rankpilot_network:
    external: true  # This allows you to join the Laravel network